
name: Deploy Blog Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.url }}

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: us-east1-docker.pkg.dev/my-blog-project-514106/blog-images/blog-backend:${{ github.sha }}

      - id: deploy-backend
        name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: blog-backend
          image: us-east1-docker.pkg.dev/my-blog-project-514106/blog-images/blog-backend:${{ github.sha }}
          region: us-east1

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: us-east1-docker.pkg.dev/my-blog-project-514106/blog-images/blog-frontend:${{ github.sha }}
          build-args: |
            VITE_BACKEND_URL=${{ steps.deploy-backend.outputs.url }}/api/v1

      - id: deploy-frontend
        name: Deploy frontend
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: blog-frontend
          image: us-east1-docker.pkg.dev/my-blog-project-514106/blog-images/blog-frontend:${{ github.sha }}
          region: us-east1
